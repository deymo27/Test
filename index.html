<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f7f8;
      --ink: #1a2330;
      --muted: #5c6b7a;
      --stamp: #e23d2b;
      --line: #d5dee4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 36rem);
      background: #fff;
      border: 1px solid var(--line);
      padding: 36px 32px 28px;
    }

    p {
      margin: 0;
      line-height: 1.45;
    }

    .stamp {
      display: inline-block;
      margin: 0 0 28px;
      padding: 6px 10px 5px;
      border: 2px solid var(--stamp);
      color: var(--stamp);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 650;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .lead {
      max-width: 34ch;
      font-size: 1.15rem;
    }

    .meta {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.95rem;
    }

    a {
      color: inherit;
    }

    a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="stamp">Online</p>
    <h1>Test</h1>
    <p class="lead">Diese Seite kommt aus dem Repository Test. Wenn du das liest, liefert GitHub die index.html aus.</p>
    <p class="meta"><a href="https://deymo27.github.io/Test/">deymo27.github.io/Test</a></p>
  </main>
</body>
</html>
